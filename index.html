<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مغاغة معاك</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7f5;
  text-align: center;
  color: #173d2c;
}
header {
  background: #075b3b;
  color: white;
  padding: 30px 15px;
}
header h1 {font-size: 30px;}
.container {padding: 20px;}
.card {
  background: white;
  padding: 20px;
  margin: 15px 0;
  border-radius: 15px;
  box-shadow: 0 2px 8px #ddd;
}
button {
  background: #087447;
  color: white;
  border: 0;
  padding: 12px 25px;
  border-radius: 8px;
  font-size: 17px;
}
</style>
</head>
<body>
<header>
<h1>مغاغة معاك 💚</h1>
<p>كل خدمات مغاغة في مكان واحد</p>
</header>
<div class="container">
<div class="card">
<h2>أهلاً بيك في مغاغة معاك</h2>
<p>منصتك للوصول إلى الخدمات بسهولة</p>
</div>
<div class="card">
<h3>🏥 الخدمات الطبية</h3>
<p>المستشفيات والعيادات والصيدليات</p>
</div>
<div class="card">
<h3>🔧 الخدمات المنزلية</h3>
<p>كهربائي وسباك وفني صيانة</p>
</div>
<div class="card">
<h3>🛍️ المحلات التجارية</h3>
<p>دليل المحلات والخدمات</p>
</div>
<div class="card">
<h3>📞 أرقام مهمة</h3>
<p>أرقام وخدمات تهم أهل مغاغة</p>
</div>
</div>
</body>
</html>
